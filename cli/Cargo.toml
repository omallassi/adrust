[package]
name = "adr"
version = "0.1.3"
authors = ["MALLASSI Olivier <Olivier.MALLASSI@gmail.com>"]
edition = "2018"

[dependencies]
clap = "4.6.7"
slog = "2.8.2"
slog-term = "2.9.2"
slog-async = "2.8.0"
lazy_static = "1.5.1"
comfy-table = "=8.0.1"
termimad = "0.35.5"
indicatif = "0.18.6"
dirs = "7.0.0"
ollama-rs = { version = "0.3.6", features = ["stream"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"

adr_core = { path = "../adr_core_local_impl" }
adr_config = { path = "../adr_config_local_impl" }
adr_search = { path = "../adr_search_local_impl" }
